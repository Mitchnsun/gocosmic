# approvedGitRepositories is omitted: this project has no git-protocol
# dependencies in package.json, so no approval list is required.
# Add explicit entries (e.g. "github.com/org/repo") if a git-sourced
# dependency is ever introduced.

# enableScripts must remain true: several direct and transitive dependencies
# require postinstall/install scripts to compile or download native binaries.
# Known packages: esbuild, sharp, lightningcss, rollup, @swc/core,
# @parcel/watcher.  See SECURITY.md for the full rationale and audit list.
enableScripts: true

nodeLinker: node-modules

yarnPath: .yarn/releases/yarn-4.14.1.cjs
